id: io.github.xyasharx.Dendro
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: dendro

# The PyQt BaseApp supplies Python and PyQt6 built for this runtime. Do not add
# a networked pip install or PyPI wheels: that would duplicate Qt and make the
# Flatpak input set non-reproducible.
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
cleanup-commands:
  - /app/cleanup-BaseApp.sh

# Dendro is not a generic host-management escape. Its only system-bus access
# is Fedora's typed DNF5 service; daemon-side Polkit policy authorizes mutation.
# There is no host filesystem mount, arbitrary system-bus access, or host shell.
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --system-talk-name=org.rpm.dnf.v0

modules:
  # Harden local Comps/AppStream XML parsing without relying on an unpinned
  # runtime package. The wheel is fetched as a hash-locked Flatpak source, not
  # through a networked dependency resolver.
  - name: python3-defusedxml
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-index --no-deps --prefix=/app defusedxml-0.7.1-py2.py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/07/6c/aa3f2f849e01cb6a001cd8554a88d4c77c5c1a31c95bdf1cf9301e6d9ef4/defusedxml-0.7.1-py2.py3-none-any.whl
        sha256: a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61

  - name: dendro
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/dendro
      # main.py reads this canonical metadata for a dependency-free --version path.
      - cp -a core ui main.py pyproject.toml /app/share/dendro/
      - find /app/share/dendro -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - find /app/share/dendro -type f -name '*.py[co]' -delete
      - |
        cat > /app/bin/dendro <<'EOF'
        #!/bin/sh
        export PYTHONPATH="/app/share/dendro${PYTHONPATH:+:${PYTHONPATH}}"
        exec python3 /app/share/dendro/main.py "$@"
        EOF
      - chmod 0755 /app/bin/dendro
      # A sandbox cannot safely claim a host-local RPM MIME handler.
      - sed -e '/^MimeType=/d' -e 's/[[:space:]]*%[fFuU]$//' data/io.github.xyasharx.Dendro.desktop > io.github.xyasharx.Dendro.desktop
      - install -Dm0644 io.github.xyasharx.Dendro.desktop /app/share/applications/io.github.xyasharx.Dendro.desktop
      - install -Dm0644 data/io.github.xyasharx.Dendro.metainfo.xml /app/share/metainfo/io.github.xyasharx.Dendro.metainfo.xml
      - install -Dm0644 data/icons/128x128/io.github.xyasharx.Dendro.png /app/share/icons/hicolor/128x128/apps/io.github.xyasharx.Dendro.png
      - install -Dm0644 data/icons/256x256/io.github.xyasharx.Dendro.png /app/share/icons/hicolor/256x256/apps/io.github.xyasharx.Dendro.png
      - install -Dm0644 data/icons/512x512/io.github.xyasharx.Dendro.png /app/share/icons/hicolor/512x512/apps/io.github.xyasharx.Dendro.png
      - install -Dm0644 io.github.xyasharx.Dendro.svg /app/share/icons/hicolor/scalable/apps/io.github.xyasharx.Dendro.svg
    sources:
      # `dir` is intentionally a CI/developer source. Release CI must build
      # from the immutable checked-out release tag; stores should replace this
      # source with a tagged archive URL and SHA-256.
      - type: dir
        path: .
        skip:
          - .git
          - .venv
          - .pytest_cache
          - .ruff_cache
          - .mypy_cache
          - .coverage
          - AppDir
          - build
          - dist
          - wheelhouse
          - squashfs-root
