app-id: io.github.xyasharx.Dendro
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: dendro

finish-args:
  # Display & Wayland/X11 Access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Host Execution Bridge (Flatpak Spawn for Host RPM/DNF and Polkit)
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=host:ro
  - --system-talk-name=org.freedesktop.PolicyKit1

modules:
  - name: python3-pyqt6
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-build-isolation --prefix=/app PyQt6
    sources: []

  - name: dendro
    buildsystem: simple
    build-commands:
      # Install Application Files
      - install -d /app/bin /app/share/dendro
      - cp -r core ui main.py /app/share/dendro/

      # Create Dynamic Entrypoint Wrapper
      - |
        cat << 'EOF' > /app/bin/dendro
        #!/bin/sh
        export PYTHONPATH="/app/share/dendro:${PYTHONPATH}"
        exec python3 /app/share/dendro/main.py "$@"
        EOF
      - chmod +x /app/bin/dendro

      # Install Desktop Entry, Metainfo, and Icon
      - install -D data/io.github.xyasharx.Dendro.desktop /app/share/applications/io.github.xyasharx.Dendro.desktop
      - install -D data/io.github.xyasharx.Dendro.metainfo.xml /app/share/metainfo/io.github.xyasharx.Dendro.metainfo.xml
      - install -D data/icons/128x128/io.github.xyasharx.Dendro.png /app/share/icons/hicolor/128x128/apps/io.github.xyasharx.Dendro.png

    sources:
      - type: dir
        path: .
