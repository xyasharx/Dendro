[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendro"
version = "2.19.0"
description = "A Fedora package manager and dependency inspector using the DNF5 system daemon."
dependencies = [
    "PyQt6>=6.6.0",
    "defusedxml>=0.7.1",
]
readme = "README.md"
authors = [
    { name = "Yashar", email = "yashar@duck.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "bandit>=1.7",
]

[project.gui-scripts]
dendro = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "ui"]

# The translation catalogs travel with the distribution. ``core.i18n`` looks for
# a ``locales`` directory beside the package first, so a wheel or sdist install
# keeps working without the system-wide copy. Keep this list in step with the
# catalog filenames under ``data/locales`` when a language is added.
[tool.setuptools.data-files]
"share/dendro/locales" = [
    "data/locales/de.json",
    "data/locales/en.json",
    "data/locales/es.json",
    "data/locales/fr.json",
    "data/locales/hi.json",
    "data/locales/pt_BR.json",
    "data/locales/pt_PT.json",
    "data/locales/ru.json",
]
