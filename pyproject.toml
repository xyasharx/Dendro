[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendro"
version = "2.21.2"
description = "A Fedora package manager and dependency inspector using the DNF5 system daemon."
dependencies = [
    "PyQt6>=6.6.0",
    "defusedxml>=0.7.1",
]
readme = "README.md"
authors = [
    { name = "Yashar", email = "yashar@duck.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "bandit>=1.7",
]

[project.gui-scripts]
dendro = "dendro.main:main"

[project.urls]
Homepage = "https://github.com/xyasharx/Dendro"
Repository = "https://github.com/xyasharx/Dendro"
Issues = "https://github.com/xyasharx/Dendro/issues"

[tool.setuptools.packages.find]
include = ["dendro*"]

# The translation catalogs travel with the distribution. ``dendro.core.i18n``
# looks for a ``locales`` directory beside the package first, so a wheel or
# sdist install keeps working without the system-wide copy. Keep this list in
# step with the catalog filenames under ``data/locales`` when a language is added.
[tool.setuptools.data-files]
"share/dendro/locales" = [
    "data/locales/de.json",
    "data/locales/en.json",
    "data/locales/es.json",
    "data/locales/fr.json",
    "data/locales/hi.json",
    "data/locales/pt_BR.json",
    "data/locales/pt_PT.json",
    "data/locales/ru.json",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "PERF",  # Perflint
    "RUF",   # Ruff-specific rules
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "FURB",  # refurb
    "RET",   # flake8-return
]
ignore = [
    "E501",  # line length managed by formatter and user-facing prose strings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
