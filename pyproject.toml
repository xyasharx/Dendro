[build-system]
requires = ["setuptools>=61.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendro"
version = "1.2.0"
description = "A modern package manager and visual dependency inspector for Fedora Linux."
readme = "README.md"
authors = [
    { name = "Yashar", email = "yashar@duck.com" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"

[project.gui-scripts]
dendro = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "ui"]
