<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <!-- Standard Technical Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .tier-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .card-bg { fill: #21262d; stroke: #30363d; stroke-width: 1; }
    .card-bg-accent { fill: #1c2128; stroke: #388bfd; stroke-width: 1; }
    .card-bg-core { fill: #1c2128; stroke: #238636; stroke-width: 1; }
    
    .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f0f6fc; }
    .txt-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .txt-tier-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #8b949e; letter-spacing: 0.8px; text-transform: uppercase; }
    
    .txt-card-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #f0f6fc; }
    .txt-card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    .txt-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #79c0ff; }
    .txt-code-green { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #7ee787; }
    
    .txt-conn-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #8b949e; }
    .conn-pill { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .line-flow { stroke: #58a6ff; stroke-width: 1.2; fill: none; }
    .line-gray { stroke: #8b949e; stroke-width: 1.2; fill: none; }
    .line-green { stroke: #3fb950; stroke-width: 1.2; fill: none; }
  </style>

  <!-- Root Canvas Background -->
  <rect width="1200" height="840" rx="6" class="bg"/>

  <!-- ====================================================================== -->
  <!-- HEADER -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 24)">
    <text x="0" y="20" class="txt-title">Dendro — System Architecture &amp; Execution Pipeline</text>
    <text x="0" y="38" class="txt-subtitle">Native in-process librpm/libdnf5 engine, deterministic two-phase taxonomy, and asynchronous execution model</text>
    
    <g transform="translate(860, 6)">
      <rect x="0" y="0" width="76" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="38" y="15" text-anchor="middle" class="txt-code">v2.6.0</text>
      <rect x="84" y="0" width="105" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="136" y="15" text-anchor="middle" class="txt-code">Fedora 40-45+</text>
      <rect x="197" y="0" width="80" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="237" y="15" text-anchor="middle" class="txt-code">PyQt6 (Qt 6)</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- LAYER 1: PRESENTATION & SHELL (PyQt6 UI) -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 72)">
    <rect width="1140" height="116" rx="4" class="tier-bg"/>
    <text x="14" y="18" class="txt-tier-hdr">1. Presentation &amp; Desktop Shell (PyQt6)</text>

    <!-- MainWindow -->
    <g transform="translate(14, 28)">
      <rect width="210" height="74" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">MainWindow</text>
      <text x="10" y="34" class="txt-card-sub">QSplitter workspace layout</text>
      <text x="10" y="48" class="txt-card-sub">Desktop portal theme listener</text>
      <text x="10" y="64" class="txt-code">Dynamic QPalette sync</text>
    </g>

    <!-- Navigation & Search -->
    <g transform="translate(238, 28)">
      <rect width="216" height="74" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">Navigation &amp; Filter Bar</text>
      <text x="10" y="34" class="txt-card-sub">HeaderBar: 250ms debouncer</text>
      <text x="10" y="48" class="txt-card-sub">CategorySidebar: 6 system pillars</text>
      <text x="10" y="64" class="txt-code">Filter: status:, cat:, arch:</text>
    </g>

    <!-- DendroTreeView -->
    <g transform="translate(468, 28)">
      <rect width="216" height="74" rx="4" class="card-bg-accent"/>
      <text x="10" y="18" class="txt-card-hdr">DendroTreeView</text>
      <text x="10" y="34" class="txt-card-sub">drawBranches vector chevrons</text>
      <text x="10" y="48" class="txt-card-sub">Multi-level dependency tree</text>
      <text x="10" y="64" class="txt-code">Upgrade path (v1 → v2)</text>
    </g>

    <!-- InspectorPanel -->
    <g transform="translate(698, 28)">
      <rect width="216" height="74" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">PackageInspectorPanel</text>
      <text x="10" y="34" class="txt-card-sub">Metadata, files, changelog tabs</text>
      <text x="10" y="48" class="txt-card-sub">rpm -V file verification</text>
      <text x="10" y="64" class="txt-code">Audit: is_protected safety check</text>
    </g>

    <!-- TransactionDrawer -->
    <g transform="translate(928, 28)">
      <rect width="198" height="74" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">TransactionDrawer &amp; Tray</text>
      <text x="10" y="34" class="txt-card-sub">Live terminal output console</text>
      <text x="10" y="48" class="txt-card-sub">ANSI and \r stream parser</text>
      <text x="10" y="64" class="txt-code">4-hour background update check</text>
    </g>
  </g>

  <!-- Connectors: Layer 1 -> Layer 2 -->
  <path d="M 576 188 L 576 216" class="line-flow" marker-end="url(#arrow)"/>
  <rect x="520" y="196" width="112" height="18" rx="3" class="conn-pill"/>
  <text x="576" y="209" text-anchor="middle" class="txt-conn-lbl">QModelIndex &amp; Signals</text>

  <!-- ====================================================================== -->
  <!-- LAYER 2: MODEL, FILTER & PRESENTATION LOGIC -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 218)">
    <rect width="1140" height="98" rx="4" class="tier-bg"/>
    <text x="14" y="18" class="txt-tier-hdr">2. Model &amp; Filter Proxy Layer (Qt Model-View Architecture)</text>

    <!-- TreeModel -->
    <g transform="translate(14, 26)">
      <rect width="360" height="58" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">DependencyTreeModel (QAbstractItemModel)</text>
      <text x="10" y="34" class="txt-card-sub">On-demand TreeItems via canFetchMore / fetchMore</text>
      <text x="10" y="48" class="txt-code">UserRoles: PackageInfoRole, IsProtectedRole, RawSizeRole</text>
    </g>

    <!-- ProxyModel -->
    <g transform="translate(388, 26)">
      <rect width="375" height="58" rx="4" class="card-bg-accent"/>
      <text x="10" y="18" class="txt-card-hdr">PackageFilterProxyModel (QSortFilterProxyModel)</text>
      <text x="10" y="34" class="txt-card-sub">Two-tier taxonomy filtering and natural version sorting</text>
      <text x="10" y="48" class="txt-code">Retains QUEUED_UPGRADE, QUEUED_REMOVE, QUEUED_INSTALL</text>
    </g>

    <!-- ItemDelegate -->
    <g transform="translate(777, 26)">
      <rect width="349" height="58" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">PackageTreeItemDelegate (QStyledItemDelegate)</text>
      <text x="10" y="34" class="txt-card-sub">Self-contained row background painting (zero theme bleed)</text>
      <text x="10" y="48" class="txt-code">Status badges and installed version display</text>
    </g>
  </g>

  <!-- Connectors: Layer 2 -> Layer 3 -->
  <path d="M 576 316 L 576 344" class="line-flow" marker-end="url(#arrow)"/>
  <rect x="500" y="324" width="152" height="18" rx="3" class="conn-pill"/>
  <text x="576" y="337" text-anchor="middle" class="txt-conn-lbl">Classification &amp; Resolution</text>

  <!-- ====================================================================== -->
  <!-- LAYER 3: CORE TAXONOMY & RESOLUTION ENGINE -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 346)">
    <rect width="1140" height="136" rx="4" class="tier-bg"/>
    <text x="14" y="18" class="txt-tier-hdr">3. Deterministic Classification &amp; Capability Resolution (core/backend.py)</text>

    <!-- ProductionTaxonomyEngine -->
    <g transform="translate(14, 26)">
      <rect width="360" height="96" rx="4" class="card-bg-core"/>
      <text x="10" y="18" class="txt-card-hdr">ProductionTaxonomyEngine</text>
      <text x="10" y="34" class="txt-card-sub">Phase 1: Physical delivery archetype (FHS layout)</text>
      <text x="10" y="48" class="txt-card-sub">Phase 2: Functional domain (XDG menu categories)</text>
      <text x="10" y="62" class="txt-card-sub">Decoupled is_protected root protection auditing</text>
      <text x="10" y="78" class="txt-code-green">Zero heuristic scoring | 100% deterministic</text>
    </g>

    <!-- PACKAGE_TAXONOMY_OVERRIDES -->
    <g transform="translate(388, 26)">
      <rect width="250" height="96" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">O(1) Overrides (Law 4)</text>
      <text x="10" y="34" class="txt-code">PACKAGE_TAXONOMY_OVERRIDES</text>
      <text x="10" y="48" class="txt-card-sub">Resolves upstream packaging paradoxes:</text>
      <text x="10" y="62" class="txt-card-sub">• Audio: pipewire, wireplumber, alsa</text>
      <text x="10" y="76" class="txt-card-sub">• Drivers &amp; Shell: mesa-dri, plasma, mutter</text>
      <text x="10" y="90" class="txt-card-sub">• Tools &amp; Security: 7zip, localsearch, pam</text>
    </g>

    <!-- PackagePhysicalAnatomy -->
    <g transform="translate(652, 26)">
      <rect width="240" height="96" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">PackagePhysicalAnatomy</text>
      <text x="10" y="34" class="txt-card-sub">RPMTAG_DIRINDEXES verification</text>
      <text x="10" y="48" class="txt-card-sub">FHS directory analysis</text>
      <text x="10" y="62" class="txt-code">Virtual capability extraction:</text>
      <text x="10" y="76" class="txt-code">• python3dist(), crate(), gstreamer1()</text>
      <text x="10" y="90" class="txt-code">• mvn(), osgi(), npm(), font()</text>
    </g>

    <!-- Catalogs & Caching -->
    <g transform="translate(906, 26)">
      <rect width="220" height="96" rx="4" class="card-bg"/>
      <text x="10" y="18" class="txt-card-hdr">Metadata Catalogs &amp; Cache</text>
      <text x="10" y="34" class="txt-card-sub">AppStreamCatalog (XML repodata)</text>
      <text x="10" y="48" class="txt-card-sub">FedoraCompsCatalog (comps.xml)</text>
      <text x="10" y="64" class="txt-code">SQLiteCapabilityCache (WAL)</text>
      <text x="10" y="78" class="txt-card-sub">L1 in-memory hash map</text>
      <text x="10" y="92" class="txt-card-sub">L2 SQLite database on disk</text>
    </g>
  </g>

  <!-- Connectors: Layer 3 -> Layer 4 -->
  <path d="M 576 482 L 576 510" class="line-flow" marker-end="url(#arrow)"/>
  <rect x="505" y="490" width="142" height="18" rx="3" class="conn-pill"/>
  <text x="576" y="503" text-anchor="middle" class="txt-conn-lbl">QRunnable Worker Dispatch</text>

  <!-- ====================================================================== -->
  <!-- LAYER 4: ASYNCHRONOUS WORKER THREAD POOL -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 512)">
    <rect width="1140" height="96" rx="4" class="tier-bg"/>
    <text x="14" y="18" class="txt-tier-hdr">4. Asynchronous Concurrency Layer (QThreadPool — Non-Blocking)</text>

    <!-- Worker 1 -->
    <g transform="translate(14, 26)">
      <rect width="170" height="56" rx="4" class="card-bg"/>
      <text x="8" y="16" class="txt-card-hdr">PackageQueryWorker</text>
      <text x="8" y="32" class="txt-card-sub">RPM database ingestion</text>
      <text x="8" y="46" class="txt-code">ts.dbMatch() traversal</text>
    </g>

    <!-- Worker 2 -->
    <g transform="translate(198, 26)">
      <rect width="175" height="56" rx="4" class="card-bg"/>
      <text x="8" y="16" class="txt-card-hdr">DependencyTreeWorker</text>
      <text x="8" y="32" class="txt-card-sub">Requirement resolution</text>
      <text x="8" y="46" class="txt-code">Provider version query</text>
    </g>

    <!-- Worker 3 -->
    <g transform="translate(387, 26)">
      <rect width="185" height="56" rx="4" class="card-bg"/>
      <text x="8" y="16" class="txt-card-hdr">ReverseDependencyWorker</text>
      <text x="8" y="32" class="txt-card-sub">Required-by analysis</text>
      <text x="8" y="46" class="txt-code">Resolves exported sonames</text>
    </g>

    <!-- Worker 4 -->
    <g transform="translate(586, 26)">
      <rect width="170" height="56" rx="4" class="card-bg"/>
      <text x="8" y="16" class="txt-card-hdr">PackageVerifyWorker</text>
      <text x="8" y="32" class="txt-card-sub">rpm -V file integrity</text>
      <text x="8" y="46" class="txt-code">Flags: S.5....T.</text>
    </g>

    <!-- Worker 5 -->
    <g transform="translate(770, 26)">
      <rect width="180" height="56" rx="4" class="card-bg"/>
      <text x="8" y="16" class="txt-card-hdr">TransactionDryRunWorker</text>
      <text x="8" y="32" class="txt-card-sub">Simulation guardrail</text>
      <text x="8" y="46" class="txt-code">Multiline safety parser</text>
    </g>

    <!-- Worker 6 -->
    <g transform="translate(964, 26)">
      <rect width="162" height="56" rx="4" class="card-bg"/>
      <text x="8" y="16" class="txt-card-hdr">SystemUpdatesWorker</text>
      <text x="8" y="32" class="txt-card-sub">check-upgrade --refresh</text>
      <text x="8" y="46" class="txt-code">Subprocess isolation</text>
    </g>
  </g>

  <!-- Connectors: Layer 4 -> Layer 5 -->
  <path d="M 576 608 L 576 636" class="line-flow" marker-end="url(#arrow)"/>
  <rect x="500" y="616" width="152" height="18" rx="3" class="conn-pill"/>
  <text x="576" y="629" text-anchor="middle" class="txt-conn-lbl">Native C/C++ FFI &amp; Polkit</text>

  <!-- ====================================================================== -->
  <!-- LAYER 5: NATIVE BRIDGES & OPERATING SYSTEM GROUND TRUTH -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 638)">
    <rect width="1140" height="168" rx="4" class="tier-bg"/>
    <text x="14" y="18" class="txt-tier-hdr">5. Native System Bridges, Privilege Elevation &amp; Fedora OS Ground Truth</text>

    <!-- librpm -->
    <g transform="translate(14, 28)">
      <rect width="265" height="58" rx="4" class="card-bg"/>
      <text x="10" y="16" class="txt-card-hdr">librpm (Native C Bindings)</text>
      <text x="10" y="32" class="txt-card-sub">Guarded via RPM_GLOBAL_LOCK</text>
      <text x="10" y="48" class="txt-code">rpm.TransactionSet | Header tags</text>
    </g>

    <!-- libdnf5 -->
    <g transform="translate(293, 28)">
      <rect width="265" height="58" rx="4" class="card-bg"/>
      <text x="10" y="16" class="txt-card-hdr">libdnf5 (Native C++ Bindings)</text>
      <text x="10" y="32" class="txt-card-sub">libdnf5.base.Base instance</text>
      <text x="10" y="48" class="txt-code">Repo sack &amp; solver queries</text>
    </g>

    <!-- Polkit -->
    <g transform="translate(572, 28)">
      <rect width="265" height="58" rx="4" class="card-bg"/>
      <text x="10" y="16" class="txt-card-hdr">Polkit (pkexec /usr/bin/dnf5)</text>
      <text x="10" y="32" class="txt-card-sub">org.dendro.policy security rules</text>
      <text x="10" y="48" class="txt-code">Sequential multi-stage runner</text>
    </g>

    <!-- RepoManagerHelper -->
    <g transform="translate(851, 28)">
      <rect width="275" height="58" rx="4" class="card-bg"/>
      <text x="10" y="16" class="txt-card-hdr">RepoManagerHelper (F40-F45+)</text>
      <text x="10" y="32" class="txt-card-sub">Scans /etc/yum.repos.d/ and</text>
      <text x="10" y="48" class="txt-code">/usr/share/dnf5/repos.d/ (relocation)</text>
    </g>

    <!-- Host Filesystem Sub-band -->
    <g transform="translate(14, 98)">
      <rect width="1112" height="56" rx="4" class="card-bg-accent"/>
      <text x="12" y="18" class="txt-card-hdr">Fedora Linux Host Ground Truth</text>
      <text x="12" y="34" class="txt-card-sub">Local RPM Database: <tspan class="txt-code">/var/lib/rpm</tspan></text>
      <text x="290" y="34" class="txt-card-sub">DNF Sacks &amp; Cache: <tspan class="txt-code">/var/cache/libdnf5/</tspan></text>
      <text x="590" y="34" class="txt-card-sub">Protection Configuration: <tspan class="txt-code">/etc/dnf/protected.d/*.conf</tspan></text>
      <text x="910" y="34" class="txt-card-sub">Kernel: <tspan class="txt-code">/usr/lib/modules/</tspan></text>
      <text x="12" y="48" class="txt-card-sub">AppStream Metadata: <tspan class="txt-code">/usr/share/swcatalog/</tspan> and <tspan class="txt-code">repodata/*appstream*.xml*</tspan></text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="826" class="txt-subtitle" text-anchor="middle">Dendro Architecture Blueprint • GPL-3.0-or-later • Component Diagram</text>
</svg>
