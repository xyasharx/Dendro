<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">Dendro evidence-driven RPM architecture</title>
  <desc id="description">A five-layer architecture diagram showing Dendro's PyQt interface, RPM metadata sources, declarative ecosystem registry, classification engine, workers, and host boundaries.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1.5 L8,5 L0,8.5 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1.5 L8,5 L0,8.5 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1.5 L8,5 L0,8.5 Z" fill="#8b949e"/>
    </marker>

    <style>
      .canvas { fill: #0d1117; }
      .frame { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .layer { fill: #161b22; stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
      .card { fill: #21262d; stroke: #30363d; stroke-width: 1; }
      .card-blue { fill: #1c2128; stroke: #388bfd; stroke-width: 1.2; }
      .card-green { fill: #1c2128; stroke: #238636; stroke-width: 1.2; }
      .card-amber { fill: #211d14; stroke: #9e6a03; stroke-width: 1; }
      .host { fill: #111820; stroke: #388bfd; stroke-width: 1; }
      .pill { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .line-blue { fill: none; stroke: #58a6ff; stroke-width: 1.25; }
      .line-green { fill: none; stroke: #3fb950; stroke-width: 1.25; }
      .line-gray { fill: none; stroke: #8b949e; stroke-width: 1.15; }
      .line-dashed { fill: none; stroke: #d29922; stroke-width: 1.15; stroke-dasharray: 4 4; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8b949e; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: .8px; fill: #8b949e; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 650; fill: #f0f6fc; }
      .card-copy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #8b949e; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; fill: #79c0ff; }
      .code-green { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; fill: #7ee787; }
      .code-amber { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; fill: #e3b341; }
      .connector { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1200" height="1040" rx="8" class="canvas"/>
  <rect x="12" y="12" width="1176" height="1016" rx="7" class="frame"/>

  <!-- Header -->
  <g transform="translate(30, 26)">
    <text x="0" y="18" class="title">Dendro — Evidence-Driven RPM Architecture</text>
    <text x="0" y="38" class="subtitle">Manifest-first classification, declarative ecosystem evidence, typed DNF5 authority, and explicit unresolved results</text>

    <g transform="translate(856, 0)">
      <rect width="76" height="23" rx="4" class="pill"/>
      <text x="38" y="15" text-anchor="middle" class="code">v2.14.2</text>
      <rect x="85" width="103" height="23" rx="4" class="pill"/>
      <text x="136" y="15" text-anchor="middle" class="code">Fedora 41+</text>
      <rect x="197" width="87" height="23" rx="4" class="pill"/>
      <text x="240" y="15" text-anchor="middle" class="code">PyQt6</text>
    </g>
  </g>

  <!-- Layer 1 -->
  <g transform="translate(30, 82)">
    <rect width="1140" height="112" rx="5" class="layer"/>
    <text x="14" y="18" class="layer-title">1. PRESENTATION, NAVIGATION &amp; EXPLANATION — PYQT6</text>

    <g transform="translate(14, 29)">
      <rect width="255" height="68" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">MainWindow &amp; Local RPM dialog</text>
      <text x="10" y="35" class="card-copy">Package tree, local RPM inspection,</text>
      <text x="10" y="49" class="card-copy">category and evidence display</text>
      <text x="10" y="63" class="code">ui/main_window.py</text>
    </g>

    <g transform="translate(283, 29)">
      <rect width="265" height="68" rx="4" class="card-blue"/>
      <text x="10" y="18" class="card-title">Header, Search &amp; Category Sidebar</text>
      <text x="10" y="35" class="card-copy">Primary categories plus ecosystem facets</text>
      <text x="10" y="49" class="card-copy">with provenance-aware search/filtering</text>
      <text x="10" y="63" class="code">sidebar.py · header.py</text>
    </g>

    <g transform="translate(562, 29)">
      <rect width="270" height="68" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">Inspector &amp; Evidence Surface</text>
      <text x="10" y="35" class="card-copy">Files, dependencies, changelog, scripts,</text>
      <text x="10" y="49" class="card-copy">classification rationale and input scope</text>
      <text x="10" y="63" class="code">PackageInspectorPanel</text>
    </g>

    <g transform="translate(846, 29)">
      <rect width="280" height="68" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">Transaction &amp; Repository Controls</text>
      <text x="10" y="35" class="card-copy">Plan review, queue state, protected-package</text>
      <text x="10" y="49" class="card-copy">warnings, constrained repository helper</text>
      <text x="10" y="63" class="code">dnf5daemon + Polkit</text>
    </g>
  </g>

  <path d="M600 194 L600 220" class="line-blue" marker-end="url(#arrow-blue)"/>
  <rect x="519" y="201" width="162" height="17" rx="3" class="pill"/>
  <text x="600" y="213" text-anchor="middle" class="connector">Package records &amp; user actions</text>

  <!-- Layer 2 -->
  <g transform="translate(30, 222)">
    <rect width="1140" height="118" rx="5" class="layer"/>
    <text x="14" y="18" class="layer-title">2. PACKAGE FACTS — EXPLICIT INPUT SCOPE</text>

    <g transform="translate(14, 29)">
      <rect width="260" height="74" rx="4" class="card-green"/>
      <text x="10" y="18" class="card-title">Installed RPM manifest</text>
      <text x="10" y="35" class="card-copy">Header directories, basenames, Provides,</text>
      <text x="10" y="49" class="card-copy">desktop entries and exported sonames</text>
      <text x="10" y="64" class="code-green">installed_manifest</text>
    </g>

    <g transform="translate(288, 29)">
      <rect width="260" height="74" rx="4" class="card-green"/>
      <text x="10" y="18" class="card-title">Local / third-party RPM</text>
      <text x="10" y="35" class="card-copy">Header inspection and RPM capabilities</text>
      <text x="10" y="49" class="card-copy">without executing package payloads</text>
      <text x="10" y="64" class="code-green">local_rpm_manifest</text>
    </g>

    <g transform="translate(562, 29)">
      <rect width="275" height="74" rx="4" class="card-blue"/>
      <text x="10" y="18" class="card-title">Remote repository result</text>
      <text x="10" y="35" class="card-copy">DNF5 safely frames newline-valued</text>
      <text x="10" y="49" class="card-copy">Provides; DNF4 remains scalar-only</text>
      <text x="10" y="64" class="code">remote_metadata</text>
    </g>

    <g transform="translate(851, 29)">
      <rect width="275" height="74" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">Supporting metadata</text>
      <text x="10" y="35" class="card-copy">AppStream, Fedora Comps, desktop metadata,</text>
      <text x="10" y="49" class="card-copy">package policy and protected-package facts</text>
      <text x="10" y="64" class="code">catalogs are evidence, not guesses</text>
    </g>
  </g>

  <path d="M600 340 L600 366" class="line-blue" marker-end="url(#arrow-blue)"/>
  <rect x="527" y="347" width="146" height="17" rx="3" class="pill"/>
  <text x="600" y="359" text-anchor="middle" class="connector">Normalized manifest facts</text>

  <!-- Layer 3 -->
  <g transform="translate(30, 368)">
    <rect width="1140" height="216" rx="5" class="layer"/>
    <text x="14" y="18" class="layer-title">3. EVIDENCE-DRIVEN TAXONOMY — DETERMINISTIC, EXPLAINABLE, CONSERVATIVE</text>

    <g transform="translate(14, 30)">
      <rect width="258" height="102" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">PackagePhysicalAnatomy</text>
      <text x="10" y="35" class="card-copy">Normalizes RPM directories, basenames,</text>
      <text x="10" y="49" class="card-copy">capabilities and payload anatomy</text>
      <text x="10" y="65" class="code">package_metadata.py</text>
      <text x="10" y="82" class="code">Provides + FHS path facts</text>
      <text x="10" y="96" class="code">no semantic guess from absence</text>
    </g>

    <g transform="translate(286, 30)">
      <rect width="258" height="102" rx="4" class="card-green"/>
      <text x="10" y="18" class="card-title">Declarative ecosystem registry</text>
      <text x="10" y="35" class="card-copy">Capability, path and conservative-name</text>
      <text x="10" y="49" class="card-copy">evidence for 17 language/platform groups</text>
      <text x="10" y="65" class="code-green">core/ecosystems.py</text>
      <text x="10" y="82" class="code-green">Perl · TeX · Go · GHC · PHP</text>
      <text x="10" y="96" class="code-green">Python · Rust · JVM · Node.js …</text>
    </g>

    <g transform="translate(558, 30)">
      <rect width="294" height="102" rx="4" class="card-blue"/>
      <text x="10" y="18" class="card-title">ProductionTaxonomyEngine</text>
      <text x="10" y="35" class="card-copy">Resolves physical role before domain;</text>
      <text x="10" y="49" class="card-copy">attaches every valid ecosystem facet</text>
      <text x="10" y="65" class="code">package_classifier.py</text>
      <text x="10" y="82" class="code">strong manifest evidence wins</text>
      <text x="10" y="96" class="code">conflicts remain explicitly unresolved</text>
    </g>

    <g transform="translate(866, 30)">
      <rect width="260" height="102" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">Shared taxonomy registry</text>
      <text x="10" y="35" class="card-copy">Category labels, sidebars, facet matching,</text>
      <text x="10" y="49" class="card-copy">filtering and removal-risk guidance</text>
      <text x="10" y="65" class="code">taxonomy.py</text>
      <text x="10" y="82" class="code">primary role + secondary tags</text>
      <text x="10" y="96" class="code">one vocabulary for UI and classifier</text>
    </g>

    <path d="M272 81 L286 81" class="line-green" marker-end="url(#arrow-green)"/>
    <path d="M544 81 L558 81" class="line-blue" marker-end="url(#arrow-blue)"/>
    <path d="M852 81 L866 81" class="line-blue" marker-end="url(#arrow-blue)"/>

    <g transform="translate(14, 146)">
      <rect width="1112" height="53" rx="4" class="card-amber"/>
      <text x="12" y="19" class="card-title">Taxonomy coverage audit — separate read-only feedback loop</text>
      <text x="12" y="36" class="card-copy">Streams installed-RPM or JSONL repository records, reports category coverage and unresolved capability/path/name clusters, and never creates automatic assignments.</text>
      <text x="850" y="36" class="code-amber">classification_audit.py · dendro-taxonomy-audit.py</text>
    </g>
  </g>

  <path d="M600 584 L600 610" class="line-blue" marker-end="url(#arrow-blue)"/>
  <rect x="522" y="591" width="156" height="17" rx="3" class="pill"/>
  <text x="600" y="603" text-anchor="middle" class="connector">Classified PackageInfo records</text>

  <!-- Layer 4 -->
  <g transform="translate(30, 612)">
    <rect width="1140" height="114" rx="5" class="layer"/>
    <text x="14" y="18" class="layer-title">4. MODEL, FILTER &amp; ASYNCHRONOUS WORKERS</text>

    <g transform="translate(14, 29)">
      <rect width="218" height="70" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">DependencyTreeModel</text>
      <text x="10" y="35" class="card-copy">PackageInfo records and lazy dependency</text>
      <text x="10" y="49" class="card-copy">tree expansion</text>
      <text x="10" y="64" class="code">QAbstractItemModel</text>
    </g>

    <g transform="translate(246, 29)">
      <rect width="224" height="70" rx="4" class="card-blue"/>
      <text x="10" y="18" class="card-title">PackageFilterProxyModel</text>
      <text x="10" y="35" class="card-copy">Primary category and ecosystem-facet</text>
      <text x="10" y="49" class="card-copy">filtering; queued changes retained</text>
      <text x="10" y="64" class="code">matching_sidebar_categories()</text>
    </g>

    <g transform="translate(484, 29)">
      <rect width="206" height="70" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">PackageQueryWorker</text>
      <text x="10" y="35" class="card-copy">Installed RPM database loading</text>
      <text x="10" y="49" class="card-copy">with complete manifest facts</text>
      <text x="10" y="64" class="code">librpm → classifier</text>
    </g>

    <g transform="translate(704, 29)">
      <rect width="205" height="70" rx="4" class="card-blue"/>
      <text x="10" y="18" class="card-title">RemotePackageSearchWorker</text>
      <text x="10" y="35" class="card-copy">Bounded on-demand repo queries</text>
      <text x="10" y="49" class="card-copy">and DNF5 capability framing</text>
      <text x="10" y="64" class="code">repoquery → classifier</text>
    </g>

    <g transform="translate(923, 29)">
      <rect width="203" height="70" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">Other read-only workers</text>
      <text x="10" y="35" class="card-copy">Dependencies, reverse deps, files,</text>
      <text x="10" y="49" class="card-copy">verification, changelogs, scripts</text>
      <text x="10" y="64" class="code">QThreadPool / signals</text>
    </g>
  </g>

  <path d="M600 726 L600 752" class="line-blue" marker-end="url(#arrow-blue)"/>
  <rect x="526" y="733" width="148" height="17" rx="3" class="pill"/>
  <text x="600" y="745" text-anchor="middle" class="connector">Bounded host interaction</text>

  <!-- Layer 5 -->
  <g transform="translate(30, 754)">
    <rect width="1140" height="220" rx="5" class="layer"/>
    <text x="14" y="18" class="layer-title">5. FEDORA HOST BOUNDARIES — READ-ONLY INSPECTION &amp; TYPED TRANSACTION AUTHORITY</text>

    <g transform="translate(14, 29)">
      <rect width="268" height="68" rx="4" class="card-green"/>
      <text x="10" y="18" class="card-title">librpm / rpm command</text>
      <text x="10" y="35" class="card-copy">Installed headers, local RPM headers,</text>
      <text x="10" y="49" class="card-copy">file ownership and verification</text>
      <text x="10" y="63" class="code-green">RPM_GLOBAL_LOCK</text>
    </g>

    <g transform="translate(296, 29)">
      <rect width="268" height="68" rx="4" class="card-blue"/>
      <text x="10" y="18" class="card-title">DNF5 / repository metadata</text>
      <text x="10" y="35" class="card-copy">Available package search and controlled</text>
      <text x="10" y="49" class="card-copy">remote metadata acquisition</text>
      <text x="10" y="63" class="code">dnf5 repoquery</text>
    </g>

    <g transform="translate(578, 29)">
      <rect width="268" height="68" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">dnf5daemon-server + Polkit</text>
      <text x="10" y="35" class="card-copy">Daemon owns transaction resolution,</text>
      <text x="10" y="49" class="card-copy">authorization and RPM transaction locks</text>
      <text x="10" y="63" class="code">org.rpm.dnf.v0</text>
    </g>

    <g transform="translate(860, 29)">
      <rect width="266" height="68" rx="4" class="card"/>
      <text x="10" y="18" class="card-title">Repository helper boundary</text>
      <text x="10" y="35" class="card-copy">Constrained HTTPS configuration add/remove;</text>
      <text x="10" y="49" class="card-copy">no generic privileged command runner</text>
      <text x="10" y="63" class="code">/usr/libexec/dendro-repo-helper</text>
    </g>

    <g transform="translate(14, 111)">
      <rect width="1112" height="91" rx="4" class="host"/>
      <text x="12" y="19" class="card-title">Fedora RPM host ground truth — intentionally unavailable to Flatpak</text>
      <text x="12" y="40" class="card-copy">RPM database</text>
      <text x="94" y="40" class="code">/var/lib/rpm</text>
      <text x="270" y="40" class="card-copy">DNF cache</text>
      <text x="340" y="40" class="code">/var/cache/libdnf5</text>
      <text x="570" y="40" class="card-copy">Protection</text>
      <text x="640" y="40" class="code">/etc/dnf/protected.d</text>
      <text x="870" y="40" class="card-copy">RPM manifests</text>
      <text x="960" y="40" class="code">Provides / paths</text>
      <text x="12" y="65" class="card-copy">Application metadata</text>
      <text x="126" y="65" class="code">AppStream · comps.xml · desktop entries</text>
      <text x="488" y="65" class="card-copy">Safety rule</text>
      <text x="560" y="65" class="code">missing or contradictory facts → unresolved</text>
    </g>
  </g>

  <text x="600" y="1008" text-anchor="middle" class="subtitle">Dendro Architecture Blueprint • GPL-3.0-or-later • Evidence-first classification without fabricated certainty</text>
</svg>
