name: Build AppImage Artifact

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build x86_64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar libfuse2 imagemagick file

      - name: Make Scripts Executable
        run: |
          chmod +x build_appimage.sh
          if [ -f data/AppRun ]; then chmod +x data/AppRun; fi

      - name: Build Standalone AppImage
        run: |
          ./build_appimage.sh

      - name: Generate AppImage SHA256 Checksum
        run: |
          sha256sum Dendro-x86_64.AppImage > Dendro-x86_64.AppImage.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            Dendro-x86_64.AppImage
            Dendro-x86_64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
