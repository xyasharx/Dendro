# Weekly check for newer hash-verified AppImage/PyPI/Python release pins.
# Updates are opened as a pull request so build_appimage.sh and release.yml
# remain reproducible and every upgrade is reviewed before entering main.

name: Update release runtime pins

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-release-pins
  cancel-in-progress: false

jobs:
  update-pins:
    name: Check and propose runtime pin updates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'

      - name: Resolve and apply updated release runtime pins
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/update_release_pins.py \
            --write \
            --summary-file /tmp/pin-updates.md
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate updated scripts and tests
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash -n build_appimage.sh
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'pytest>=8.0'
          python3 -m pytest --noconftest -q \
            tests/test_build_requirements.py \
            tests/test_entrypoint.py \
            tests/test_update_release_pins.py

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch='chore/update-release-pins'
          title='Update hash-pinned release runtime versions'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add build_appimage.sh .github/workflows/release.yml io.github.xyasharx.Dendro.yml
          git commit -m "$title"
          git push --force origin "HEAD:${branch}"

          cat > /tmp/pr-body.md <<'BODY'
          Automated update of hash-pinned release runtime dependencies (`build_appimage.sh`, `.github/workflows/release.yml`, and Flatpak `defusedxml`).

          BODY
          cat /tmp/pin-updates.md >> /tmp/pr-body.md
          cat >> /tmp/pr-body.md <<'BODY'

          > [!NOTE]
          > Pull requests opened with the default `GITHUB_TOKEN` do not trigger `on: pull_request` workflows automatically. Close and reopen this PR (or push an empty commit) to run the full `Build x86_64 AppImage` and `Fedora` CI matrix before merging.
          BODY

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --title "$title" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/pr-body.md
          fi
