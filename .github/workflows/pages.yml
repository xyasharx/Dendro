# Publish the project site in docs/ to GitHub Pages.
#
# The site is plain HTML, CSS and images with no build step, so it is uploaded
# as an artifact and deployed directly. Keeping it a workflow rather than a
# branch means the deployed copy cannot drift from `main`.
#
# Repository Settings -> Pages must be set to "GitHub Actions" for this to run.

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time. `cancel-in-progress: false` lets an in-flight
# publish finish rather than leaving the site half updated.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail here rather than publishing a page with a broken reference: a 404
      # on the screenshot is the first thing a visitor would notice.
      - name: Check the site's local references resolve
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          root = Path("docs")
          index = root / "index.html"
          html = index.read_text(encoding="utf-8")

          # Every reference on the page is relative, so it resolves the same way
          # on the project site, on a preview, and from a local file.
          missing = []
          for match in re.finditer(r'(?:src|href)="([^"]+)"', html):
              target = match.group(1)
              if target.startswith(("http:", "https:", "mailto:", "#", "data:")):
                  continue
              path = urlparse(target).path
              if not path:
                  continue
              if not (root / unquote(path)).resolve().exists():
                  missing.append(target)

          if missing:
              sys.exit("Unresolved local references: " + ", ".join(sorted(set(missing))))
          print("All local references resolve.")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
