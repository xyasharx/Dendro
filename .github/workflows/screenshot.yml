name: Generate App Screenshot

on:
  workflow_dispatch: # به شما اجازه می‌دهد با یک دکمه دستی آن را اجرا کنید

permissions:
  contents: write

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Fedora GUI & Dependencies
        run: |
          dnf update -y
          dnf install -y python3 python3-pip qt6-qtbase qt6-qtbase-gui xorg-x11-server-Xvfb ImageMagick procps-ng git rpm

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install PyQt6

      - name: Run Dendro & Capture Screenshot
        run: |
          mkdir -p data/screenshots
          # اجرای سرور نمایش مجازی
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          
          # اجرای برنامه Dendro در پس‌زمینه
          python3 main.py &
          sleep 4 # صبر برای لود شدن کامل پنجره
          
          # گرفتن اسکرین‌شات با کیفیت بالا
          import -window root data/screenshots/main_window.png

      - name: Commit and Push Screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screenshots/main_window.png
          git commit -m "chore: update application screenshot" || exit 0
          git push
