name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'build_appimage.sh'
      - 'ci/prepare_appstream_validator.sh'
      - 'ci/smoke_test_appimage.sh'
      - 'core/**'
      - 'data/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'tools/verify_release_tag.py'
      - 'ui/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new vX.Y.Z tag whose exact source will be built and published.
        required: true
        type: string

permissions:
  contents: write

# A manual recovery run executes this workflow from a repaired branch while
# checking out and publishing the immutable release tag supplied by the operator.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

jobs:
  build-appimage:
    name: Build x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      # A recovery dispatch runs the fixed workflow from a branch, but builds
      # the already-published tag. Keep validation tooling on that trusted
      # workflow revision rather than requiring it to exist in the old tag.
      - name: Check out release validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          path: .release-control

      # Ubuntu 22.04's system Python is 3.10, while tomllib starts in 3.11.
      # Declare the metadata parser runtime instead of relying on the image default.
      - name: Set up Python for release metadata validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'

      - name: Verify a tag matches the packaged version
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: python .release-control/tools/verify_release_tag.py --tag "$RELEASE_TAG"

      - name: Install AppImage build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            curl \
            desktop-file-utils \
            libegl1 \
            libxcb-shape0 \
            tar \
            xdotool \
            xvfb

      - name: Prepare AppStream 1.0 validator
        run: bash .release-control/ci/prepare_appstream_validator.sh

      - name: Build AppImage
        run: PATH="${RUNNER_TEMP}/dendro-appstream-validator-bin:${PATH}" bash build_appimage.sh

      - name: Smoke-test AppImage GUI startup
        run: bash ci/smoke_test_appimage.sh Dendro-x86_64.AppImage

      - name: Checksum AppImage
        run: sha256sum Dendro-x86_64.AppImage > Dendro-x86_64.AppImage.sha256

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-dist
          if-no-files-found: error
          path: |
            Dendro-x86_64.AppImage
            Dendro-x86_64.AppImage.sha256

  build-python:
    name: Build Python distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Check out release validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          path: .release-control

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'

      - name: Verify a tag matches the packaged version
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: python .release-control/tools/verify_release_tag.py --tag "$RELEASE_TAG"

      - name: Build and smoke-test distributions
        run: |
          python -m pip install --disable-pip-version-check --upgrade \
            'build==1.6.1' \
            'setuptools==84.0.0' \
            'wheel==0.48.0'
          python -m build --no-isolation
          python -m pip install --disable-pip-version-check --no-deps --force-reinstall dist/*.whl
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; assert version('dendro') == '${expected_version}'"
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload Python artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          if-no-files-found: error
          path: dist/

  publish-release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs: [build-appimage, build-python]
    runs-on: ubuntu-24.04
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-dist
          path: release-assets/

      - name: Download Python artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: release-assets/

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
          # Keep manually curated notes intact during an existing-tag recovery.
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-copr:
    name: Trigger COPR build
    needs: [publish-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Call configured COPR webhook
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "${COPR_WEBHOOK_URL}" ]; then
            echo 'COPR_WEBHOOK_URL is not configured; skipping COPR trigger.'
            exit 0
          fi
          curl --fail-with-body --show-error --silent --request POST "${COPR_WEBHOOK_URL}"
          echo 'COPR build trigger accepted.'
