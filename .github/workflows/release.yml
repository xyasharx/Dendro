name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build x86_64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify a tag matches the packaged version
        if: github.ref_type == 'tag'
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"

      - name: Install AppImage build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            curl \
            desktop-file-utils \
            libfuse2t64 \
            tar

      - name: Build and checksum AppImage
        run: |
          bash build_appimage.sh
          sha256sum Dendro-x86_64.AppImage > Dendro-x86_64.AppImage.sha256

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-dist
          if-no-files-found: error
          path: |
            Dendro-x86_64.AppImage
            Dendro-x86_64.AppImage.sha256

  build-python:
    name: Build Python distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify a tag matches the packaged version
        if: github.ref_type == 'tag'
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'

      - name: Build and smoke-test distributions
        run: |
          python -m pip install --disable-pip-version-check --upgrade \
            'build==1.6.1' \
            'setuptools==84.0.0' \
            'wheel==0.48.0'
          python -m build --no-isolation
          python -m pip install --disable-pip-version-check --no-deps --force-reinstall dist/*.whl
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; assert version('dendro') == '${expected_version}'"
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload Python artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          if-no-files-found: error
          path: dist/

  publish-release:
    name: Publish release
    needs: [build-appimage, build-python]
    runs-on: ubuntu-24.04
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-dist
          path: release-assets/

      - name: Download Python artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-copr:
    name: Trigger COPR build
    needs: [publish-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Call configured COPR webhook
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "${COPR_WEBHOOK_URL}" ]; then
            echo 'COPR_WEBHOOK_URL is not configured; skipping COPR trigger.'
            exit 0
          fi
          curl --fail-with-body --show-error --silent --request POST "${COPR_WEBHOOK_URL}"
          echo 'COPR build trigger accepted.'
