name: Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build Standalone AppImage
  # ---------------------------------------------------------------------------
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar libfuse2 imagemagick file

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          if [ -f data/AppRun ]; then chmod +x data/AppRun; fi
          ./build_appimage.sh
          sha256sum Dendro-x86_64.AppImage > Dendro-x86_64.AppImage.sha256

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-dist
          path: |
            Dendro-x86_64.AppImage
            Dendro-x86_64.AppImage.sha256

  # ---------------------------------------------------------------------------
  # Job 2: Build Python Wheel & Source Distribution
  # ---------------------------------------------------------------------------
  build-python:
    name: Build Python Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Build Wheel & Tarball
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ---------------------------------------------------------------------------
  # Job 3: Create Single Unified GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Official Release
    needs: [build-appimage, build-python]
    runs-on: ubuntu-latest
    steps:
      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-dist
          path: release-assets/

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
