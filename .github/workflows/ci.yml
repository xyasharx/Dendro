name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Fedora Test Matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      # ۱. نصب پیش‌نیازهای کانتینر قبل از Checkout
      - name: Install Container Prerequisites
        run: |
          dnf install -y git tar

      # ۲. کلون کد با آخرین نسخه اکشن v7
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # ۳. نصب پکیج‌های رسمی فدورا (PyQt6 و Pytest بومی جهت دور زدن PEP 668 و باینری‌های C)
      - name: Install Fedora & Qt6 Dependencies
        run: |
          dnf install -y \
            python3 \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-pyqt6 \
            python3-pytest \
            python3-pytest-qt \
            qt6-qtbase-gui \
            mesa-dri-drivers \
            libxkbcommon-x11 \
            glibc-langpack-en \
            rpm

      # ۴. نصب بسته در حالت توسعه با رعایت استانداردهای سیستم
      - name: Install Dendro in Development Mode
        run: |
          pip install --no-deps -e . --break-system-packages

      # ۵. اجرای تست‌های بدون تصویر (Headless Offscreen)
      - name: Run Tests (Headless Qt Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
          LC_ALL: en_US.UTF-8
        run: |
          pytest -v tests/
