name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Fedora Test Matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      # ۱. آماده‌سازی کانتینر و رفع دائمی خطای مالکیت گیت
      - name: Configure Git Safe Directory & Tools
        run: |
          dnf install -y git tar rpm
          git config --global --add safe.directory '*'

      # ۲. دریافت کد مخزن با اکشن v7
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # ۳. نصب تمام پکیج‌های بومی فدورا و پیش‌نیازهای رندرینگ کیوت
      - name: Install Fedora System Dependencies
        run: |
          dnf install -y \
            python3 \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-pyqt6 \
            python3-pytest \
            python3-pytest-qt \
            qt6-qtbase-gui \
            mesa-dri-drivers \
            libxkbcommon-x11 \
            xkeyboard-config \
            glibc-langpack-en \
            rpm

      # ۴. تنظیم مسیرهای پایتون و اجرای مستقیم تست‌ها
      - name: Run Tests (Headless Qt Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
          LC_ALL: en_US.UTF-8
        run: |
          pytest -v tests/
