name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Test every release the project claims to support (README/SECURITY.md
      # state Fedora 43+). When a release reaches end-of-life, move the floor,
      # this matrix, and the COPR chroots together in one change. Do not drift:
      # COPR (`xyasharx/dendro`) publishes to fedora-43/44/45/rawhide, so a
      # release users can install must be one CI actually exercises.
      matrix:
        fedora: ['43', '44', '45']
    container:
      image: fedora:${{ matrix.fedora }}

    steps:
      - name: Install checkout prerequisites
        run: |
          dnf install -y git tar
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build, test, and metadata tools
        run: |
          dnf install -y \
            appstream \
            bash-completion \
            desktop-file-utils \
            flatpak-builder \
            python3 \
            python3-defusedxml \
            python3-gobject \
            python3-devel \
            python3-pip \
            python3-pyqt6-base \
            python3-pytest \
            python3-pytest-qt \
            python3-rpm \
            pyproject-rpm-macros \
            python3-setuptools \
            python3-wheel \
            rpm \
            rpm-build \
            ruff
          # Supported Fedora releases no longer provide the Bandit RPM. This
          # disposable container installs the declared test-only security
          # scanner from PyPI.
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --root-user-action=ignore \
            --break-system-packages \
            "bandit>=1.7"

      - name: Validate repository and release metadata
        run: |
          git diff --check
          desktop-file-validate data/io.github.xyasharx.Dendro.desktop
          appstreamcli validate --no-net data/io.github.xyasharx.Dendro.metainfo.xml
          flatpak-builder --show-manifest io.github.xyasharx.Dendro.yml >/dev/null

      - name: Compile, lint, and security-check source
        run: |
          python3 -m compileall -q core ui tools main.py setup.py
          # Retain the repository-wide correctness gate while requiring selected
          # newer or recently changed modules to meet explicit modern Ruff rules.
          ruff check core ui main.py tests tools --select=F,E9
          ruff check --select=E,F,I,UP,B,SIM,PERF,RUF --ignore=E501 \
            core/taxonomy.py \
            core/i18n.py \
            core/package_metadata.py \
            core/package_classifier.py \
            core/ecosystems.py \
            core/host_environment.py \
            core/daemon_locale.py \
            core/rpmostree_status.py \
            core/classification_audit.py \
            core/build_provenance.py \
            core/transaction_controller.py \
            setup.py \
            tools/dendro-taxonomy-audit.py \
            tools/dendro-i18n.py \
            ui/advisory_dialog.py \
            ui/external_links.py \
            ui/icons.py \
            ui/i18n.py \
            ui/header.py \
            ui/inspector_panel.py \
            ui/key_import_dialog.py \
            ui/main_window.py \
            ui/settings_dialog.py \
            ui/sidebar.py \
            ui/theme_coordinator.py \
            ui/window_presentation.py \
            ui/transaction_drawer.py \
            ui/transaction_plan_dialog.py \
            ui/flatpak_dialog.py \
            ui/history_dialog.py \
            ui/repo_dialog.py \
            tests/test_advisory_dialog.py \
            tests/test_key_import_dialog.py \
            tests/test_key_prompt_dispatch.py \
            tests/test_security_advisories.py \
            tests/test_taxonomy_registry.py \
            tests/test_package_metadata_parsers.py \
            tests/test_ecosystem_registry.py \
            tests/test_host_environment.py \
            tests/test_i18n.py \
            tests/test_rpmostree_status.py \
            tests/test_classification_audit.py \
            tests/test_build_provenance.py \
            tests/test_external_links.py \
            tests/test_transaction_controller.py \
            tests/test_ui_icon_helpers.py \
            tests/test_visual_regressions.py \
            tests/test_worker_lifecycle.py
          ruff format --check \
            main.py \
            setup.py \
            core/backend.py \
            core/dnf5daemon.py \
            core/models.py \
            core/transaction_controller.py \
            core/taxonomy.py \
            core/i18n.py \
            core/package_metadata.py \
            core/package_classifier.py \
            core/ecosystems.py \
            core/host_environment.py \
            core/daemon_locale.py \
            core/rpmostree_status.py \
            core/classification_audit.py \
            core/build_provenance.py \
            core/_build_info.py \
            tools/dendro-taxonomy-audit.py \
            tools/dendro-i18n.py \
            ui/i18n.py \
            ui/advisory_dialog.py \
            ui/external_links.py \
            ui/header.py \
            ui/history_dialog.py \
            ui/icons.py \
            ui/inspector_panel.py \
            ui/key_import_dialog.py \
            ui/main_window.py \
            ui/repo_dialog.py \
            ui/settings_dialog.py \
            ui/sidebar.py \
            ui/theme_coordinator.py \
            ui/window_presentation.py \
            ui/transaction_drawer.py \
            tests/test_backend_boundaries.py \
            tests/test_backend_failure_contracts.py \
            tests/test_core.py \
            tests/test_advisory_dialog.py \
            tests/test_dnf5daemon.py \
            tests/test_daemon_locale.py \
            tests/test_theme_coordinator.py \
            tests/test_window_presentation.py \
            tests/test_entrypoint.py \
            tests/test_external_links.py \
            tests/test_key_import_dialog.py \
            tests/test_key_prompt_dispatch.py \
            tests/test_query_failure_feedback.py \
            tests/test_security_advisories.py \
            tests/test_search_filter_help.py \
            tests/test_taxonomy_registry.py \
            tests/test_transaction_controller.py \
            tests/test_package_metadata_parsers.py \
            tests/test_ecosystem_registry.py \
            tests/test_host_environment.py \
            tests/test_i18n.py \
            tests/test_rpmostree_status.py \
            tests/test_classification_audit.py \
            tests/test_build_provenance.py \
            tests/test_ui_icon_helpers.py \
            tests/test_visual_regressions.py \
            tests/test_worker_lifecycle.py
          # XML readers are a security boundary; regressions are blocked before
          # they reach a release build.
          python3 -m bandit -q -r \
            core/taxonomy.py \
            core/i18n.py \
            core/package_metadata.py \
            core/package_classifier.py \
            core/ecosystems.py \
            core/host_environment.py \
            core/rpmostree_status.py \
            core/classification_audit.py \
            core/build_provenance.py -lll

      - name: Run isolated Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          export DENDRO_I18N_TRACE="$(mktemp)"
          trap 'rm -rf "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$DENDRO_I18N_TRACE"' EXIT
          set +e

          # One process per test file. A Qt fault takes the whole interpreter
          # with it, so a single-process run reports only the file that died and
          # loses every result after it; with a process per file the other 47
          # still report their own outcome.
          #
          # -u matters: on a fault the interpreter dies before atexit flushes
          # buffered pipes, so an exit 139 once arrived with an empty log.
          failed=""
          crashed=""
          for test_file in tests/test_*.py; do
            python3 -u -X faulthandler -m pytest -q "$test_file" \
              > "/tmp/$(basename "$test_file").log" 2>&1
            file_status=$?
            if [ $file_status -eq 139 ] || [ $file_status -eq 134 ]; then
              crashed="$crashed $test_file"
              echo "::error title=Qt fault::SIGSEGV in $test_file (status $file_status)"
              tail -25 "/tmp/$(basename "$test_file").log"
            elif [ $file_status -ne 0 ]; then
              failed="$failed $test_file"
              echo "::error title=test failures::nonzero exit in $test_file"
              grep -E "^(FAILED|ERROR)" "/tmp/$(basename "$test_file").log" | head -20
            fi
          done

          # Rerun a file that faulted, alone and verbose, so the annotation names
          # the exact test instead of the nearest one the log happened to reach.
          for test_file in $crashed; do
            echo "::error title=Qt fault detail::rerunning $test_file for the failing test name"
            python3 -u -X faulthandler -m pytest -v "$test_file" > /tmp/crashed.log 2>&1
            crash_status=$?
            inflight=$(grep -E "^tests/.*::" /tmp/crashed.log | tail -2 \
              | sed 's/ *\[[ 0-9]*%\]//' | tr '\n' '~')
            # A native fault's stack is printed as "Binary file ..., at <symbol>"
            # frames. Without them the annotation kept only the tail of the
            # run, which says nothing about where the process died.
            summary=$(grep -E "^Fatal Python error|^Current thread|^Thread 0x|^  Binary file|^  File |^       [A-Za-z_]" \
              /tmp/crashed.log | head -30 | tr '\n' '~')
            echo "::error title=Qt fault test::status=$crash_status inflight=$inflight $summary"
            # The stack is the only thing that names a native crash, so it gets
            # its own annotation with the frames intact.
            frames=$(sed -n '/^Fatal Python error/,/^$/p' /tmp/crashed.log | head -40)
            if [ -n "$frames" ]; then
              echo "::error title=Qt fault stack::$frames"
            fi
            tail -40 /tmp/crashed.log
          done

          if [ -n "$failed" ]; then
            echo "::error title=test failures::files with failures:$failed"
            set -e
            exit 1
          fi
          # A fault fails the job even when a rerun would pass. Retrying it away
          # would hide precisely the intermittent class of bug this job exists to
          # catch, and the project has already been burned by one of those.
          if [ -n "$crashed" ]; then
            echo "::error title=Qt fault::files that segfaulted:$crashed"
            set -e
            exit 139
          fi
          set -e

      - name: Build and smoke-test the wheel without network dependency resolution
        run: |
          mkdir -p wheelhouse
          python3 -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir wheelhouse .
          python3 -m pip install --disable-pip-version-check --root-user-action=ignore --no-deps --force-reinstall wheelhouse/*.whl
          expected_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          actual_version="$(cd "$smoke_directory" && dendro --version)"
          python3 - "$expected_version" "$actual_version" <<'PY'
          import re
          import sys

          version, actual = sys.argv[1:]
          pattern = rf"dendro {re.escape(version)} \(Git commit [0-9a-f]{{40}}(?:[0-9a-f]{{24}})?; Git tree [0-9a-f]{{40}}(?:[0-9a-f]{{24}})?\)"
          if not re.fullmatch(pattern, actual):
              raise SystemExit(f"wheel did not retain source provenance: {actual!r}")
          PY

      - name: Build the RPM from an immutable checkout archive
        run: |
          # Actions runs this under `bash -e`, so a failing command aborts the
          # script before the status can be captured or reported. That is why a
          # failure here arrived as a bare "exit code 1" with no annotation at
          # all for several rounds.
          set +e

          report() {
            # The job log cannot be fetched, so the annotation is the only
            # channel: put the actual error lines in it, not just an exit code.
            errors=$(grep -iE "error:|No such file|not found|FileNotFound|ERROR |Bad exit|^FAILED|^E   |passed|failed" "$1" \
              | tail -30 | tr '\n' '~')
            echo "::error title=rpm-build-failed::$2 status=$3 $errors"
          }

          version="$(rpmspec -q --qf '%{VERSION}' dendro.spec)"
          status=$?
          if [ $status -ne 0 ] || [ -z "$version" ]; then
            echo "::error title=rpm-build-failed::rpmspec status=$status version='$version'"
            exit 1
          fi

          mkdir -p "$HOME/rpmbuild/SOURCES"
          git archive --format=tar.gz --prefix="Dendro-${version}/" HEAD \
            > "$HOME/rpmbuild/SOURCES/dendro-${version}.tar.gz"
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error title=rpm-build-failed::git archive status=$status"
            exit 1
          fi

          # One full build. Phase-by-phase only when it fails, so a green run
          # does not pay for building twice.
          rpmbuild -ba dendro.spec > /tmp/rpmbuild.log 2>&1
          status=$?
          cat /tmp/rpmbuild.log
          if [ $status -ne 0 ]; then
            report /tmp/rpmbuild.log "rpmbuild -ba" "$status"
            for phase in "-bp" "-bc" "-bi"; do
              rpmbuild "$phase" dendro.spec > "/tmp/rpmbuild${phase}.log" 2>&1
              phase_status=$?
              cat "/tmp/rpmbuild${phase}.log"
              if [ $phase_status -ne 0 ]; then
                report "/tmp/rpmbuild${phase}.log" "rpmbuild $phase" "$phase_status"
                break
              fi
            done
            exit 1
          fi
