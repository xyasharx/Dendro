name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Fedora Test Matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      # ۱. تنظیم محیط و ابزارهای گیت
      - name: Configure Git Safe Directory & Tools
        run: |
          dnf install -y git tar rpm
          git config --global --add safe.directory '*'

      # ۲. دریافت کدها
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # ۳. پاکسازی خودکار و دائمی کاراکترهای ویندوز (CRLF -> LF)
      - name: Sanitize Line Endings (CRLF to LF)
        run: |
          find . -type f -exec sed -i 's/\r$//' {} +

      # ۴. نصب پیش‌نیازهای بومی فدورا
      - name: Install Fedora System Dependencies
        run: |
          dnf install -y \
            python3 \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-pyqt6 \
            python3-pytest \
            python3-pytest-qt \
            python3-rpm \
            python3-libdnf5 \
            libdnf5 \
            dnf5 \
            qt6-qtbase-gui \
            mesa-dri-drivers \
            libxkbcommon-x11 \
            xkeyboard-config \
            glibc-langpack-en \
            desktop-file-utils \
            libappstream-glib

      # ۵. بررسی متادیتای برنامه‌ها
      - name: Validate Packaging Metadata
        run: |
          desktop-file-validate data/io.github.xyasharx.Dendro.desktop
          appstream-util validate-relax --nonet data/io.github.xyasharx.Dendro.metainfo.xml

      # Check for syntax errors, undefined names (NameError), and missing attributes
      - name: Static Code Analysis (Zero Undefined Names)
        run: |
          pip install ruff
          ruff check . --select F821,F822,E999

      # ۶. اجرای تست‌ها
      - name: Run Tests (Headless Qt Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
          LC_ALL: en_US.UTF-8
        run: |
          pytest -v tests/
