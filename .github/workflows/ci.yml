name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Fedora Test Matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Fedora System Dependencies
        run: |
          dnf install -y \
            python3 \
            python3-pip \
            python3-devel \
            gcc \
            qt6-qtbase \
            qt6-qtbase-gui \
            xorg-x11-server-Xvfb \
            mesa-dri-drivers \
            rpm \
            git

      - name: Install Python Tooling & App
        run: |
          pip install --upgrade pip --break-system-packages
          pip install pytest pytest-qt PyQt6 --break-system-packages
          pip install -e . --no-deps --break-system-packages

      - name: Run Headless Unit Tests
        run: |
          xvfb-run -a pytest -v tests/
