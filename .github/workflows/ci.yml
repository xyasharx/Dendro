name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    container:
      image: fedora:${{ matrix.fedora }}

    steps:
      - name: Install checkout prerequisites
        run: |
          dnf install -y git tar
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build, test, and metadata tools
        run: |
          dnf install -y \
            appstream \
            bash-completion \
            desktop-file-utils \
            flatpak-builder \
            python3 \
            python3-defusedxml \
            python3-gobject \
            python3-devel \
            python3-pip \
            python3-pyqt6-base \
            python3-pytest \
            python3-pytest-qt \
            python3-rpm \
            pyproject-rpm-macros \
            python3-setuptools \
            python3-wheel \
            rpm \
            rpm-build \
            ruff
          # Fedora 43/44 no longer provide the Bandit RPM. This disposable
          # container installs the declared test-only security scanner from PyPI.
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --root-user-action=ignore \
            --break-system-packages \
            "bandit>=1.7"

      - name: Validate repository and release metadata
        run: |
          git diff --check
          desktop-file-validate data/io.github.xyasharx.Dendro.desktop
          appstreamcli validate --no-net data/io.github.xyasharx.Dendro.metainfo.xml
          flatpak-builder --show-manifest io.github.xyasharx.Dendro.yml >/dev/null

      - name: Compile, lint, and security-check source
        run: |
          python3 -m compileall -q core ui tools main.py setup.py
          # Retain the repository-wide correctness gate while requiring selected
          # newer or recently changed modules to meet explicit modern Ruff rules.
          ruff check core ui main.py tests tools --select=F,E9
          ruff check --select=E,F,I,UP,B,SIM,PERF,RUF --ignore=E501 \
            core/taxonomy.py \
            core/package_metadata.py \
            core/package_classifier.py \
            core/build_provenance.py \
            setup.py \
            ui/external_links.py \
            ui/settings_dialog.py \
            tests/test_taxonomy_registry.py \
            tests/test_package_metadata_parsers.py \
            tests/test_build_provenance.py \
            tests/test_external_links.py
          ruff format --check \
            main.py \
            setup.py \
            core/backend.py \
            core/dnf5daemon.py \
            core/models.py \
            core/transaction_controller.py \
            core/taxonomy.py \
            core/package_metadata.py \
            core/package_classifier.py \
            core/build_provenance.py \
            core/_build_info.py \
            ui/external_links.py \
            ui/header.py \
            ui/history_dialog.py \
            ui/inspector_panel.py \
            ui/main_window.py \
            ui/settings_dialog.py \
            ui/sidebar.py \
            tests/test_backend_boundaries.py \
            tests/test_backend_failure_contracts.py \
            tests/test_core.py \
            tests/test_dnf5daemon.py \
            tests/test_entrypoint.py \
            tests/test_external_links.py \
            tests/test_query_failure_feedback.py \
            tests/test_search_filter_help.py \
            tests/test_taxonomy_registry.py \
            tests/test_transaction_controller.py \
            tests/test_package_metadata_parsers.py \
            tests/test_build_provenance.py
          # XML readers are a security boundary; regressions are blocked before
          # they reach a release build.
          python3 -m bandit -q -r \
            core/taxonomy.py \
            core/package_metadata.py \
            core/package_classifier.py \
            core/build_provenance.py -lll

      - name: Run isolated Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          trap 'rm -rf "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"' EXIT
          python3 -m pytest -q tests

      - name: Build and smoke-test the wheel without network dependency resolution
        run: |
          mkdir -p wheelhouse
          python3 -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir wheelhouse .
          python3 -m pip install --disable-pip-version-check --root-user-action=ignore --no-deps --force-reinstall wheelhouse/*.whl
          expected_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          actual_version="$(cd "$smoke_directory" && dendro --version)"
          python3 - "$expected_version" "$actual_version" <<'PY'
          import re
          import sys

          version, actual = sys.argv[1:]
          pattern = rf"dendro {re.escape(version)} \(Git commit [0-9a-f]{{40}}(?:[0-9a-f]{{24}})?; Git tree [0-9a-f]{{40}}(?:[0-9a-f]{{24}})?\)"
          if not re.fullmatch(pattern, actual):
              raise SystemExit(f"wheel did not retain source provenance: {actual!r}")
          PY

      - name: Build the RPM from an immutable checkout archive
        run: |
          version="$(rpmspec -q --qf '%{VERSION}' dendro.spec)"
          test -n "$version"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          git archive --format=tar.gz --prefix="Dendro-${version}/" HEAD > "$HOME/rpmbuild/SOURCES/dendro-${version}.tar.gz"
          rpmbuild -ba dendro.spec
