name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Fedora Test Matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Fedora Dependencies
        run: |
          dnf install -y \
            python3 \
            python3-pip \
            python3-devel \
            gcc \
            qt6-qtbase \
            qt6-qtbase-gui \
            mesa-dri-drivers \
            rpm \
            git

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install pytest PyQt6
          pip install -e . || pip install -r requirements.txt

      - name: Run Tests (Headless Qt Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          pytest -v tests/
