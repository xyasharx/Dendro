name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Fedora Test Matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      # 1. Prepare container environment and trust git workspace
      - name: Configure Git Safe Directory & Tools
        run: |
          dnf install -y git tar rpm
          git config --global --add safe.directory '*'

      # 2. Check out repository
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # 3. Install Fedora native toolchain, Qt6 dependencies, and librpm/libdnf5 bindings
      - name: Install Fedora System Dependencies
        run: |
          dnf install -y \
            python3 \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-pyqt6 \
            python3-pytest \
            python3-pytest-qt \
            python3-rpm \
            python3-libdnf5 \
            libdnf5 \
            dnf5 \
            qt6-qtbase-gui \
            mesa-dri-drivers \
            libxkbcommon-x11 \
            xkeyboard-config \
            glibc-langpack-en \
            desktop-file-utils \
            libappstream-glib

      # 4. Verify desktop integration and AppStream metadata
      - name: Validate Packaging Metadata
        run: |
          desktop-file-validate data/io.github.xyasharx.Dendro.desktop
          appstream-util validate-relax --nonet data/io.github.xyasharx.Dendro.metainfo.xml

      # 5. Run test suite headlessly with native librpm and libdnf5 verification
      - name: Run Tests (Headless Qt Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
          LC_ALL: en_US.UTF-8
        run: |
          pytest -v tests/
