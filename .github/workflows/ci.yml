name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Fedora Test Matrix
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      # ۱. نصب پیش‌نیازهای اولیه سیستم و رفع خطای امنیتی گیت
      - name: Prepare Container Environment
        run: |
          dnf install -y git tar
          git config --global --add safe.directory '*'

      # ۲. دریافت سورس کد با اکشن v7
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # ۳. نصب پکیج‌های بومی فدورا شامل پکیج حیاتی xkeyboard-config
      - name: Install Fedora & Qt6 Dependencies
        run: |
          dnf install -y \
            python3 \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-pyqt6 \
            python3-pytest \
            python3-pytest-qt \
            qt6-qtbase-gui \
            mesa-dri-drivers \
            libxkbcommon-x11 \
            xkeyboard-config \
            glibc-langpack-en \
            rpm

      # ۴. نصب بدون Build Isolation جهت استفاده مستقیم از پکیج‌های فدورا
      - name: Install Dendro in Development Mode
        run: |
          pip install --no-build-isolation --no-deps -e . --break-system-packages

      # ۵. اجرای تست‌های Qt بدون تصویر
      - name: Run Tests (Headless Qt Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
          LC_ALL: en_US.UTF-8
        run: |
          pytest -v tests/
